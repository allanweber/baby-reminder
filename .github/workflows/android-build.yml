name: Android build

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: app

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # Decode the release keystore from a secret into a temp file. When the
      # secret isn't set (e.g. PRs from forks), the build below falls back to
      # debug signing — CI still passes, the artifacts just aren't uploadable
      # to Play. See app/README.md for the secrets to configure.
      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload-keystore.jks" >> "$GITHUB_ENV"
            echo "Release keystore decoded — build will be release-signed."
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret set — build will fall back to debug signing."
          fi

      # The App Bundle (.aab) is the artifact uploaded to Google Play. The APK
      # is kept alongside it for quick sideload testing on a device.
      - name: Build release App Bundle (Play) and APK (sideload)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build appbundle --release
          flutter build apk --release

      - name: Upload App Bundle (.aab)
        uses: actions/upload-artifact@v4
        with:
          name: nestling-appbundle
          path: app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nestling-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
