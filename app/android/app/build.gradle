plugins {
    id "com.android.application"
    // kotlin-android is deliberately NOT declared here. With
    // android.builtInKotlin=false the Flutter Gradle Plugin applies it to every
    // module that doesn't declare it, so Kotlin still compiles -- and Flutter's
    // AGP 9 KGP warning, which regex-scans this file for the declaration, stays
    // quiet. Re-adding it here brings the warning back.
    // The Flutter Gradle Plugin must be applied after the Android plugin.
    id "dev.flutter.flutter-gradle-plugin"
}

// Release signing resolves from one of two sources, in priority order:
//   1. Environment variables (ANDROID_KEYSTORE_PATH / _PASSWORD / _KEY_ALIAS /
//      ANDROID_KEY_PASSWORD) — how CI signs, decoding the keystore from a
//      GitHub Actions secret. Nothing sensitive is committed.
//   2. A local, git-ignored android/key.properties pointing at a keystore on
//      the developer's machine — for local `flutter build --release`.
// If neither is present the release build falls back to debug signing so the
// build still succeeds (e.g. PRs from forks with no secrets).
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
def hasKeystoreFile = keystorePropertiesFile.exists()
if (hasKeystoreFile) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}
def envKeystorePath = System.getenv("ANDROID_KEYSTORE_PATH")
def useEnvSigning = envKeystorePath != null && !envKeystorePath.isEmpty()
def hasReleaseSigning = useEnvSigning || hasKeystoreFile

android {
    namespace = "com.allanweber.nestling"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        // Required by flutter_local_notifications v18: it relies on java.time
        // APIs that only exist on newer Android, so they must be desugared for
        // older devices. Without this the app crashes natively (below the Dart
        // layer, so nothing is catchable) the moment it schedules a notification.
        coreLibraryDesugaringEnabled = true
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "com.allanweber.nestling"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        // The `alarm` package requires API 23+. Flutter's default floor is now
        // 24, which already satisfies it, so we track Flutter's value instead of
        // pinning our own -- MinSdkVersionMigration rewrites any lower hardcoded
        // value on every build anyway.
        minSdkVersion = flutter.minSdkVersion
        // Google Play requires apps to target Android 16 (API 36) or higher to
        // stay updatable (enforced from 31 Aug 2026). Flutter's default
        // `targetSdkVersion` still lags at 35, so we pin 36 explicitly instead
        // of tracking it -- compileSdk above already resolves to 36+ from
        // flutter.compileSdkVersion, so the APIs are available. Revisit when
        // Flutter's default catches up (then this can track flutter again).
        targetSdk = 36
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        multiDexEnabled = true
    }

    signingConfigs {
        release {
            if (useEnvSigning) {
                storeFile = file(envKeystorePath)
                storePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias = System.getenv("ANDROID_KEY_ALIAS")
                keyPassword = System.getenv("ANDROID_KEY_PASSWORD")
            } else if (hasKeystoreFile) {
                storeFile = keystoreProperties["storeFile"] ? file(keystoreProperties["storeFile"]) : null
                storePassword = keystoreProperties["storePassword"]
                keyAlias = keystoreProperties["keyAlias"]
                keyPassword = keystoreProperties["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            // Sign with the real upload key when either signing source is
            // available (env vars in CI, or a local key.properties); otherwise
            // fall back to debug signing so the build still succeeds.
            signingConfig = hasReleaseSigning ? signingConfigs.release : signingConfigs.debug

            // Bundle the native (C/C++) debug symbols into the .aab so Google
            // Play can symbolicate native crashes and ANRs (libflutter.so and
            // plugin .so files) instead of showing raw addresses. Play extracts
            // these from the bundle; they are not shipped to devices. Without
            // this, Play warns "you've not uploaded debug symbols" on upload.
            ndk {
                debugSymbolLevel = "FULL"
            }
        }
    }
}

// Replaces the old `android { kotlinOptions { ... } }`, which AGP 9's built-in
// Kotlin does not provide. Keep in step with the Java 8 compatibility above.
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8
    }
}

flutter {
    source = "../.."
}

dependencies {
    // The desugaring runtime that backs coreLibraryDesugaringEnabled above.
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"
}
