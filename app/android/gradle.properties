org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# AGP 9 compiles Kotlin itself. Every Android module in this build supports it:
# the app module declares no kotlin-android plugin, and alarm >=5.11.0,
# audioplayers_android >=5.3.0 and shared_preferences_android >=2.4.27 all
# either skip or no longer declare KGP. Set explicitly so Flutter's
# DisableBuiltInKotlinMigration leaves it alone (it only appends when absent).
android.builtInKotlin=true
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
